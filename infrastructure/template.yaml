AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudForge - Advanced Cloud-Based Collaborative Project Workspace (UCS531)

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.11
    Environment:
      Variables:
        CLOUDFORGE_S3_BUCKET: !Ref StorageBucket
        PROJECTS_TABLE: !Ref ProjectsTable
        FILE_VERSIONS_TABLE: !Ref FileVersionsTable
        ACTIVITY_LOGS_TABLE: !Ref ActivityLogsTable
        CLOUDFORGE_ALLOWED_ORIGIN: https://cloud-forge-nine.vercel.app

Resources:
  CloudForgeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - https://cloud-forge-nine.vercel.app
        AllowHeaders:
          - Authorization
          - Content-Type
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        MaxAge: 600
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_VbsvQD5W7
              audience:
                - 547ok56mnn9ii8o36q72lorpbr

  # CognitoUserPool:
  #   Type: AWS::Cognito::UserPool
  #   Properties:
  #     UsernameAttributes:
  #       - email
  #     AutoVerifiedAttributes:
  #       - email
  #     UsernameConfiguration:
  #       CaseSensitive: false
  #     AccountRecoverySetting:
  #       RecoveryMechanisms:
  #         - Name: verified_email
  #           Priority: 1
