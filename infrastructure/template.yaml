  #       PasswordPolicy:
  #         MinimumLength: 8
  #         RequireLowercase: true
  #         RequireNumbers: true
  #         RequireSymbols: true
  #         RequireUppercase: true
  #     Schema:
  #       - Name: name
  #         Required: true
  #         Mutable: true
  #       - Name: email
  #         Required: true
  #         Mutable: true

  # CognitoUserPoolClient:
  #   Type: AWS::Cognito::UserPoolClient
  #   Properties:
  #     UserPoolId: !Ref CognitoUserPool
  #     GenerateSecret: false
  #     ExplicitAuthFlows:
  #       - ALLOW_USER_PASSWORD_AUTH
  #       - ALLOW_USER_SRP_AUTH
  #       - ALLOW_REFRESH_TOKEN_AUTH
  #     PreventUserExistenceErrors: ENABLED

  # ----------------------------------------------------------------------------
  # Storage: S3 Bucket with Versioning & EventBridge enabled
  # ----------------------------------------------------------------------------
  StorageBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'cloudforge-workspace-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Enabled
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST, HEAD]
            AllowedOrigins: ['https://cloud-forge-nine.vercel.app']
            ExposedHeaders: [ETag, x-amz-version-id]
            MaxAge: 3000

  # ----------------------------------------------------------------------------
  # Database: DynamoDB Tables
  # ----------------------------------------------------------------------------
  ProjectsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudForge_Projects
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH

  FileVersionsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudForge_FileVersions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: fileId
          AttributeType: S
        - AttributeName: versionId
          AttributeType: S
      KeySchema:
        - AttributeName: fileId
          KeyType: HASH
        - AttributeName: versionId
          KeyType: RANGE

  ActivityLogsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: CloudForge_ActivityLogs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: projectId
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S
      KeySchema:
        - AttributeName: projectId
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE

  # ----------------------------------------------------------------------------
  # Event Processing: SQS Queue & EventBridge Rule
  # ----------------------------------------------------------------------------
  FileEventsQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudforge-file-events-queue
      VisibilityTimeout: 120
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FileEventsDeadLetterQueue.Arn
        maxReceiveCount: 5

  FileEventsDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: cloudforge-file-events-dlq

  QueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FileEventsQueue
      PolicyDocument:
        Statement:
          - Action: sqs:SendMessage
            Effect: Allow
            Resource: !GetAtt FileEventsQueue.Arn
            Principal:
              Service: events.amazonaws.com
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt S3EventsRule.Arn

  S3EventsRule:
    Type: AWS::Events::Rule
    Properties:
      Name: cloudforge-s3-events-rule
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
          - Object Deleted
        detail:
          bucket:
            name:
              - !Ref StorageBucket
      Targets:
        - Arn: !GetAtt FileEventsQueue.Arn
          Id: CloudForgeSQSTarget

  # ----------------------------------------------------------------------------
  # Backend Lambdas
  # ----------------------------------------------------------------------------
  ApiHandlerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/api_handler/
      Handler: main.handler
      Role: arn:aws:iam::444296186342:role/LabRole
  #     Policies:
  #       - Version: '2012-10-17'
  #         Statement:
  #           - Sid: WorkspaceObjectOperations
  #             Effect: Allow
  #             Action:
  #               - s3:GetObject
  #               - s3:GetObjectVersion
  #               - s3:PutObject
  #               - s3:DeleteObject
  #             Resource: !Sub '${StorageBucket.Arn}/*'
  #           - Sid: WorkspaceBucketListing
  #             Effect: Allow
  #             Action:
  #               - s3:ListBucket
  #               - s3:ListBucketVersions
  #             Resource: !GetAtt StorageBucket.Arn
  #       - DynamoDBCrudPolicy:
  #           TableName: !Ref ProjectsTable
  #       - DynamoDBCrudPolicy:
  #           TableName: !Ref FileVersionsTable
  #       - DynamoDBCrudPolicy:
  #           TableName: !Ref ActivityLogsTable
      Events:
        RootApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref CloudForgeHttpApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer

  EventWorkerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../backend/event_worker/
      Handler: worker.lambda_handler
      Role: arn:aws:iam::444296186342:role/LabRole
      # Policies:
      #   - S3ReadPolicy:
      #       BucketName: !Ref StorageBucket
      #   - DynamoDBCrudPolicy:
      #       TableName: !Ref ProjectsTable
      #   - DynamoDBCrudPolicy:
      #       TableName: !Ref FileVersionsTable
      #   - DynamoDBCrudPolicy:
      #       TableName: !Ref ActivityLogsTable
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !GetAtt FileEventsQueue.Arn
            BatchSize: 10
            FunctionResponseTypes:
              - ReportBatchItemFailures

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub "https://${CloudForgeHttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  CognitoUserPoolId:
    Description: Cognito User Pool ID for the frontend configuration
    Value: us-east-1_VbsvQD5W7
  CognitoClientId:
    Description: Public Cognito app client ID for the frontend configuration
    Value: 547ok56mnn9ii8o36q72lorpbr
  S3Bucket:
    Description: S3 Storage Bucket
    Value: !Ref StorageBucket
  SQSQueueUrl:
    Description: SQS Queue URL
    Value: !Ref FileEventsQueue
